services:
  db:
    image: postgres:18
    container_name: lug-postgres
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: lug_dev
      POSTGRES_USER: lug_user
      POSTGRES_PASSWORD: lug_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    restart: unless-stopped
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://lug_user:lug_password@db:5432/lug_dev"
      UPLOAD_DIR: "/data/uploads"
      SMTP_HOST: "mailpit"
    ports:
      - "3000:3000"
    volumes:
      - blog_uploads:/data/uploads
    depends_on:
      - db
  mailpit:
    image: axllent/mailpit:latest
    container_name: lug-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (the app sends here)
      - "8025:8025" # web inbox

volumes:
  postgres_data:
  blog_uploads:
